<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAKURA CLUB ♡ 桜の世界へ</title>

    <link href="./output.css" rel="stylesheet">
</head>

<body class="min-h-screen m-0 bg-gradient-to-br from-rose-100 via-[#F8F1E7] to-purple-100 flex items-center justify-center p-6">

    <main class="w-full max-w-sm">

        <section id="sakura-widget"
            class="relative w-full max-w-sm rounded-3xl shadow-lg p-5 text-[#6B5878]">

            <div id="petals"></div>

            <header class="text-center mb-4">

                <h1 class="text-2xl font-serif font-bold tracking-wide">
                    SAKURA CLUB ♡
                </h1>

                <p class="italic text-sm mt-1">
                    桜の世界へ 🌸
                </p>

                <img src="./images/sakura.png"
                    alt="Cherry blossoms"
                    class="relative z-10 w-28 h-28 object-cover rounded-2xl mx-auto mb-3">

            </header>


            <section class="text-center mb-4">

                <p class="text-xs uppercase tracking-widest opacity-70">
                    Today
                </p>

                <p id="date" class="font-serif text-lg"></p>

                <p id="time" class="font-serif text-sm opacity-70"></p>

            </section>


            <section class="bg-[#F8F1E7]/80 rounded-2xl p-3 mb-4 text-center">

                <p class="text-xs uppercase tracking-widest opacity-70 mb-1">
                    🎋
                </p>

                <p id="meaning" class="font-serif text-lg">
                    一期一会
                </p>

                <p class="font-serif italic text-sm mt-1">
                    One life, one encounter.
                </p>

            </section>


            <section class="text-center">

                <p class="text-xs uppercase tracking-widest opacity-70">
                    Pomodoro
                </p>

                <p id="timer" class="text-3xl font-serif font-bold my-2">
                    25:00
                </p>

                <button id="timer-button"
                    class="bg-[#6B5878] text-[#F8F1E7] px-5 py-2 rounded-full text-sm hover:opacity-90">
                    Start
                </button>

            </section>

        </section>

    </main>

    <script src="./script.js"></script>

</body>

</html>
